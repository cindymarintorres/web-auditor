services:
  auditor:
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: "1.49.0" # debe coincidir con "playwright" en package.json
    image: web-auditor:latest
    ports:
      # Solo local. Quita el "127.0.0.1:" si lo expones directo (mejor tras un proxy)
      - "${HOST_PORT:-3000}:3000"
    environment:
      API_KEY: ${API_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
    volumes:
      - ./sessions:/app/sessions:ro # sesiones guardadas con `pnpm save-session`
      - ./src/application/storage/videos:/app/src/application/storage/videos
    init: true # evita procesos zombie de Chromium
    shm_size: "1gb" # memoria compartida para Chromium
    deploy:
      resources:
        limits:
          memory: 2g # ajusta según pruebas y tu MAX_CONCURRENT
    healthcheck:
      # Usa node (ya viene en la imagen), así no dependemos de curl
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped